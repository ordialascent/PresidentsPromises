# Promises and ambitions of George W. Bush's 2001-2005 term, extracted under
# corpus/PROTOCOL.md (protocol 1) from three sources: the 2000 acceptance
# speech, the 2000 final debate (Bush's turns) and the 2001 inaugural.
# Every source occurrence is named by an include row in that source's
# screening ledger (<year>-<kind>.screening.yaml); `npm run validate` checks both.
#
# 69 promises (high 17, medium 14, low 38)
# 43 ambitions (high 7, medium 10, low 26)
# Deadlines default to the end of the term (2005-01-20).

protocol: 1
promises:

