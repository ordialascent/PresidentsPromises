# Screening ledger for 1996-debate.md (protocol v1).
# Only Clinton's turns (speaker_label "The President") are screened. Every
# trigger-matched sentence has a row. Ids shared with the other two ledgers
# are further occurrences of the same promise; a soft restatement of a firm
# promise is an occurrence of it.
#
# ¶321.3-321.4 list what voters "decide whether we're going to" do on
# 5 November. Conditionals tied to the election count as firm (PROTOCOL.md
# §2), so these are promises. Not candidates: ¶117.3 ("I've got a plan …
# at least a million"), a present-tense description of a plan.
source: 1996-debate
