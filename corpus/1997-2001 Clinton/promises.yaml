# Promises and ambitions of Bill Clinton's 1997-2001 term, extracted under
# corpus/PROTOCOL.md (protocol 1) from three sources: the 1996 acceptance
# speech, the 1996 final debate (Clinton's turns) and the 1997 inaugural.
# Every source occurrence is named by an include row in that source's
# screening ledger (<year>-<kind>.screening.yaml); `npm run validate` checks both.
#
# 25 promises (high 7, medium 7, low 11)
# 58 ambitions (high 20, medium 13, low 25)
# Deadlines default to the end of the term (2001-01-20).

protocol: 1
promises:
  # ---- inaugural ----------------------------------------------------------
  - id: clinton-1996-overcome-prejudice
    kind: promise
    sources:
    - in: inaugural
      ref: ¶11.2-11.4
      quote: "We cannot, we will not, succumb to the dark impulses that lurk in the far regions of the soul everywhere. We shall overcome them. And we shall replace them with the generous spirit of a people who feel at home with one another."
    restatement: "Overcome racial, religious and political prejudice and replace it with a generous spirit."
    type: ongoing
    theme: rights
    deadline: { stated: null, applied: 2001-01-20 }
    verifiability:
      level: low
    uncertainty:
      extraction: probable
      note: "\"We\" is the nation, including the government he leads; read as a commitment of both."
    links: []

