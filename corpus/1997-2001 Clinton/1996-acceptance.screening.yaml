# Screening ledger for 1996-acceptance.md (protocol v1).
# Every trigger-matched sentence has a row; rows marked `added` were not
# matched by the lexicon but state in the future tense, or for a stated
# future period, what he or his administration will do (PROTOCOL.md §1).
# Ids shared with the other two ledgers are further occurrences of the same
# promise.
#
# Not candidates: "I propose …" sentences that describe a proposal in the
# present tense (¶25.1, ¶39.3, ¶59.1-59.2, ¶61.1-61.2, ¶77.5), as "I propose
# a real prescription drug benefit" in the 2000 debate (Bush ¶23.16), and
# "I believe … ought to" positions (¶25.2-25.3). ¶81.4 is added because it
# names a period ("in the next 4 years") and a target, as an intention.
