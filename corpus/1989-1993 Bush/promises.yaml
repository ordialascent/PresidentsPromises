# Promises and ambitions of George H. W. Bush's 1989-1993 term, extracted under
# corpus/PROTOCOL.md (protocol 1) from three sources: the 1988 acceptance
# speech, the 1988 final debate (Bush's turns) and the 1989 inaugural.
# Every source occurrence is named by an include row in that source's
# screening ledger (<year>-<kind>.screening.yaml); `npm run validate` checks both.
#
# 35 promises (high 2, medium 16, low 17)
# 27 ambitions (high 5, medium 3, low 19)
# Deadlines default to the end of the term (1993-01-20).

protocol: 1
promises:
  # ---- inaugural ----------------------------------------------------------
  - id: bush-1988-act-on-what-we-know
    kind: ambition
    sources:
    - in: inaugural
      ref: ¶9.5
      quote: "We must act on what we know."
    restatement: "Act on what the country knows works: free markets, free speech, free elections."
    type: ongoing
    theme: government
    deadline: { stated: null, applied: 1993-01-20 }
    verifiability:
      level: low
    uncertainty:
      extraction: probable
      note: "\"We\" is the nation; read as including the government he now leads."
    links: []

