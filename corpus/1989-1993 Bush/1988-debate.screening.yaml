# Screening ledger for 1988-debate.md (protocol v1).
# Only Bush's turns (speaker_label "BUSH") are screened.
# Every trigger-matched sentence has a row. Ids shared with the other two
# ledgers are further occurrences of the same promise; a soft restatement
# of a firm promise is an occurrence of it.
#
# Added: ¶16.17 ("So I'm pledged to do that", holding the line on taxes)
# and ¶114.2 ("what I would do is appoint people … who will interpret the
# Constitution").
#
# Not candidates: ¶16.10 describes the flexible freeze ("what I call a
# flexible freeze that allows growth about 4 percent"), and ¶162.8 is a
# past proposal ("I've made some proposals"). ¶139.9-139.10 ("never go back
# to that … grain embargo"; "We never should go back to that") carry no
# trigger.
#
# The source transcript breaks Bush's turns at ¶62/¶64 and ¶162/¶164 around
# interruptions; the text is kept as published.
