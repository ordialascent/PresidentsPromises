# Promises extracted from George W. Bush's 2004 nomination acceptance speech
# (corpus/2005-2009 Bush/2004-acceptance.md). Refs are paragraph.sentence, per
# corpus/README.md.
#
# Each promise is scored on four dimensions — the ingredients that decide
# whether "was it kept?" can even be asked as a *measured* question:
#
#   metric     — is there a named quantity, AND a record that tracks it?
#   threshold  — a number or an explicit direction ("double", "to zero", "every")?
#   deadline   — a date or a bounded period ("in ten years", "by end of term")?
#   instrument — does he name what HE will DO, or only what WILL happen?
#
# measurable:
#   full     — metric + threshold + deadline all present (even if parametrically
#              disputed — that dispute is the product, not a disqualifier)
#   partial  — at least one of the three is missing or too vague to pin down
#   no       — aspirational; no measurable quantity at all
# (instrument sharpens accountability: an outcome-only promise is one he can't
#  fully control. A promise can still be measurable without it.)
#
# NOTE: this speech recurrently frames domestic pledges "in a new term" — a
# bounded period that counts as a deadline ("by end of term"), so several
# otherwise-vague pledges carry a real time bound even where no number does.

promises:
  - id: bush-2004-homes-ownership
    ref: "¶26.2"
    theme: housing
    quote: >
      Tonight we set a new goal: 7 million more affordable homes in the next 10
      years so more American families will be able to open the door and say,
      "Welcome to my home."
    restatement: Add 7 million more affordable homes over the next ten years.
    metric:
      present: true
      quantity: number of affordable / owner-occupied homes added
      record: Census homeownership & housing-unit series; HUD affordable-housing counts
    threshold:
      present: true
      stated: 7 million more
    deadline:
      present: true
      stated: in the next 10 years (2004 -> ~2014)
    instrument:
      present: true
      stated: "\"we set a new goal\" — a national goal, no specific federal program named"
    measurable: "full"
    notes: >
      The one cleanly-shaped promise here, and exactly the Obama oil-import
      shape: a number and a decade, all four ingredients nominally present — but
      "affordable homes" has no agreed definition (units built? net homeownership
      gain? added to which baseline?), so the boundary you pick swings the
      verdict, and the instrument is only a stated goal, not a named mechanism.

  - id: bush-2004-health-centers
    ref: "¶22.4"
    theme: health
    quote: >
      In a new term, I will ensure every poor county in America has a community
      or rural health center.
    restatement: Give every poor county a community or rural health center within the term.
    metric:
      present: true
      quantity: number of poor counties lacking a community/rural health center
      record: HRSA health-center program site/coverage data
    threshold:
      present: true
      stated: every poor county (to zero without)
    deadline:
      present: true
      stated: in a new term (by end of term, ~Jan 2009)
    instrument:
      present: true
      stated: "\"I will ensure\" — federal health-center funding/expansion"
    measurable: "full"
    notes: >
      Metric, an absolute threshold, and a term-bounded deadline all present.
      The disputed boundary is entirely in the definitions — what counts as a
      "poor county" and what counts as a qualifying "community or rural health
      center" (a full site, an access point, a subsidized clinic?).

  - id: bush-2004-job-training-double
    ref: "¶19.1-19.3"
    theme: labor
    quote: >
      Another priority in a new term will be to help workers take advantage of
      the expanding economy to find better and higher paying jobs. [...] So we
      will double the number of people served by our principal job training
      program and increase funding for our community colleges.
    restatement: Double the number served by the principal job-training program in a new term.
    metric:
      present: true
      quantity: people served by the principal federal job-training program
      record: DoL/ETA WIA (Workforce Investment Act) participant counts
    threshold:
      present: true
      stated: double (100% increase)
    deadline:
      present: true
      stated: in a new term (from the ¶19.1 framing)
    instrument:
      present: true
      stated: increased federal training funding
    measurable: "full"
    notes: >
      "Double" is a clean directional threshold and the deadline rides in on the
      paragraph's "in a new term" framing, so it grades full — but the baseline
      year the doubling is measured from, and which program counts as "our
      principal job training program," are the open parameters. The community-
      college half is only "increase funding" (direction, no number).

  - id: bush-2004-tax-reform
    ref: "¶18.3"
    theme: taxes
    quote: >
      In a new term, I will lead a bipartisan effort to reform and simplify the
      Federal Tax Code.
    restatement: Lead a bipartisan effort to reform and simplify the tax code.
    metric:
      present: false
      quantity: no clean quantity ("simpler, fairer, progrowth" has no agreed measure)
      record: null
    threshold:
      present: true
      stated: simpler / fairer (direction only, no number)
    deadline:
      present: true
      stated: in a new term
    instrument:
      present: true
      stated: "\"lead a bipartisan effort\" — legislative push"
    measurable: "partial"
    notes: >
      A term-bounded deadline and a named instrument, but "reform and simplify"
      is a direction with no metric and no threshold — measurable only as "did a
      tax-reform bill pass?", a yes/no, not a tracked quantity.

  - id: bush-2004-tax-relief-permanent
    theme: taxes
    sources:
      - in: acceptance
        ref: "¶17.4"
        quote: >
          To create jobs, my plan will encourage investment and
          expansion by restraining Federal spending, reducing
          regulation, and making the tax relief permanent.
      - in: debate
        ref: "¶145.4"
        quote: >
          It's to make sure we have fiscal sanity and keep taxes
          low.
    restatement: Restrain spending, cut regulation, and make the tax cuts permanent.
    metric:
      present: false
      quantity: three bundled aims, no single quantity (spending, regulation, tax permanence)
      record: null
    threshold:
      present: true
      stated: restrain / reduce / make permanent (directions, no numbers)
    deadline:
      present: false
      stated: null
    instrument:
      present: true
      stated: his fiscal/legislative plan
    measurable: "partial"
    notes: >
      A compound of three directional aims with a named instrument but no number
      and no deadline. "Making the tax relief permanent" is a clean yes/no; the
      spending-restraint half has a record (outlays) but no target the promise
      pins it to.

  - id: bush-2004-energy-imports
    ref: "¶17.5"
    theme: energy
    quote: >
      To create jobs, we will make our country less dependent on foreign sources
      of energy.
    restatement: Reduce US dependence on foreign energy.
    metric:
      present: true
      quantity: energy / oil imports as a share of consumption
      record: EIA imports and net-import-share series
    threshold:
      present: true
      stated: "\"less dependent\" — direction only, no number"
    deadline:
      present: false
      stated: null
    instrument:
      present: false
      stated: "\"we will make\" — no named mechanism"
    measurable: "partial"
    notes: >
      The instructive contrast with Obama's fully-shaped "end our dependence on
      oil from the Middle East in ten years": same metric and record, but here
      only a direction ("less"), no number, no deadline, and no instrument —
      the same subject stripped of everything that would make it gradable.

  - id: bush-2004-small-biz-health
    ref: "¶21.3"
    theme: health
    quote: >
      In a new term, we must allow small firms to join together to purchase
      insurance at the discounts available to big companies.
    restatement: Let small firms pool to buy insurance at large-employer discounts.
    metric:
      present: false
      quantity: policy action (association health plans enacted), not a quantity
      record: null
    threshold:
      present: false
      stated: null
    deadline:
      present: true
      stated: in a new term
    instrument:
      present: true
      stated: change law to permit association health plans
    measurable: "partial"
    notes: >
      A named instrument with a term deadline, but no metric and no threshold —
      measurable only as "did association-health-plan legislation pass?" The
      disputed boundary is what qualifies as the promised pooling authority.

  - id: bush-2004-hsa-taxcredit
    theme: health
    sources:
      - in: acceptance
        ref: "¶22.1"
        quote: >
          We will offer a tax credit to encourage small businesses
          and their employees to set up health savings accounts and
          provide direct help for low-income Americans to purchase
          them.
      - in: debate
        ref: "¶95.6-95.7"
        quote: >
          It's one of the reasons I'm a strong believer in what they
          call health savings accounts. These are accounts that
          allow somebody to buy a low-premium, high-deductible
          catastrophic plan and couple it with tax-free savings.
    restatement: Create a tax credit to spread health savings accounts, with help for low-income buyers.
    metric:
      present: true
      quantity: HSA enrollment / accounts opened (uptake)
      record: Treasury/IRS HSA data; industry HSA census
    threshold:
      present: false
      stated: null
    deadline:
      present: false
      stated: null
    instrument:
      present: true
      stated: a new tax credit plus direct subsidies
    measurable: "partial"
    notes: >
      A clear instrument and a trackable uptake metric, but no target number and
      no deadline — "encourage" sets no level the promise can be held to.

  - id: bush-2004-medical-liability
    theme: health
    sources:
      - in: acceptance
        ref: "¶23.2"
        quote: >
          To make health care more affordable and accessible, we
          must pass medical liability reform now.
      - in: debate
        ref: "¶96.2"
        quote: >
          That's why I'm such a strong believer in medical liability
          reform.
    restatement: Pass medical liability (malpractice) reform.
    metric:
      present: false
      quantity: policy action (federal malpractice reform enacted), not a quantity
      record: null
    threshold:
      present: false
      stated: null
    deadline:
      present: false
      stated: "\"now\" is urgency, not a bounded deadline"
    instrument:
      present: true
      stated: pass federal liability-reform legislation
    measurable: "partial"
    notes: >
      "Now" reads as a deadline but functions like Obama's "immediately/soon" —
      urgency, not a date — so it does not count. A yes/no policy outcome with no
      quantity behind it.

  - id: bush-2004-comptime-flextime
    ref: "¶24.2"
    theme: labor
    quote: >
      In a new term, we will change outdated labor laws to offer comp-time and
      flex-time.
    restatement: Change labor law to allow comp-time and flex-time.
    metric:
      present: false
      quantity: policy action (labor-law change), not a quantity
      record: null
    threshold:
      present: false
      stated: null
    deadline:
      present: true
      stated: in a new term
    instrument:
      present: true
      stated: amend federal labor law
    measurable: "partial"
    notes: >
      Named instrument and a term deadline, but no metric and no threshold — a
      binary "did the law change?" The scope of "comp-time and flex-time" is the
      only thing to adjudicate.

  - id: bush-2004-opportunity-zones
    ref: "¶20.2-20.3"
    theme: economy
    quote: >
      To stand with workers in poor communities and those that have lost
      manufacturing, textile, and other jobs, we will create American
      opportunity zones. In these areas, we will provide tax relief and other
      incentives [...]
    restatement: Create "American opportunity zones" with tax relief and incentives for distressed areas.
    metric:
      present: false
      quantity: policy action (zones created), not a tracked quantity
      record: null
    threshold:
      present: false
      stated: null
    deadline:
      present: false
      stated: null
    instrument:
      present: true
      stated: create zones offering tax relief and incentives
    measurable: "partial"
    notes: >
      A concrete instrument but no number, no deadline, and no metric — gradable
      only as "were the zones created?" What counts as an "opportunity zone" (and
      how many) is left entirely open.

  - id: bush-2004-ss-personal-accounts
    theme: social-security
    sources:
      - in: acceptance
        ref: "¶27.4"
        quote: >
          We must strengthen Social Security by allowing younger
          workers to save some of their taxes in a personal account,
          a nest egg you can call your own and Government can never
          take away.
      - in: debate
        ref: "¶131.1"
        quote: >
          I believe that younger workers ought to be allowed to take
          some of their own money and put it in a personal savings
          account, because I understand that they need to get better
          rates of return than the rates of return being given in
          the current Social Security trust.
    restatement: Let younger workers divert some payroll taxes into personal Social Security accounts.
    metric:
      present: false
      quantity: policy action (private-account law enacted), not a quantity
      record: null
    threshold:
      present: true
      stated: "\"some of their taxes\" — a direction with no magnitude"
    deadline:
      present: false
      stated: null
    instrument:
      present: true
      stated: create personal retirement accounts within Social Security
    measurable: "partial"
    notes: >
      A named instrument, but "some of their taxes" fixes no share and there is
      no deadline — the yes/no of whether private accounts were ever enacted (they
      were not) is all that can be measured.

  - id: bush-2004-child-health-enroll
    ref: "¶32.2"
    theme: health
    quote: >
      In a new term, we will lead an aggressive effort to enroll millions of poor
      children who are eligible but not signed up for the Government's health
      insurance programs.
    restatement: Enroll millions of eligible-but-unenrolled poor children in public health insurance.
    metric:
      present: true
      quantity: children newly enrolled in Medicaid/SCHIP
      record: CMS Medicaid/SCHIP enrollment data
    threshold:
      present: true
      stated: "\"millions\" — a soft number, no precise target or baseline"
    deadline:
      present: true
      stated: in a new term
    instrument:
      present: true
      stated: "\"an aggressive effort\" — federal enrollment/outreach push"
    measurable: "partial"
    notes: >
      Metric, deadline, and instrument are all present, so this comes closest of
      the domestic pledges to full — but "millions" is an unquantified target with
      no baseline, so the threshold is too soft to pin, holding it at partial.

  - id: bush-2004-pell-grants
    theme: education
    sources:
      - in: acceptance
        ref: "¶31.6"
        quote: >
          By raising performance in our high schools and expanding
          Pell grants for low- and middle-income families, we will
          help more Americans start their career with a college
          diploma.
      - in: debate
        ref: "¶52.3"
        quote: >
          You got—4 more years, I've got more to do to continue to
          raise standards, to continue to reward teachers and school
          districts that are working, to emphasize math and science
          in the classrooms, to continue to expand Pell grants, to
          make sure that people have an opportunity to start their
          career with a college diploma.
    restatement: Expand Pell grants to raise college completion.
    metric:
      present: true
      quantity: Pell grant recipients / maximum award; college completion
      record: Dept. of Education Federal Pell Grant program data
    threshold:
      present: true
      stated: "\"expanding\" / \"more\" — direction only"
    deadline:
      present: false
      stated: null
    instrument:
      present: true
      stated: increase Pell grant funding/eligibility
    measurable: "partial"
    notes: >
      Real metric and record, but only a direction ("expanding", "more") and no
      deadline. The college-diploma half is an outcome he can't fully control and
      can't cleanly attribute to the Pell change.

  - id: bush-2004-hs-graduation-exam
    ref: "¶31.5"
    theme: education
    quote: >
      As we make progress, we will require a rigorous exam before graduation.
    restatement: Require a rigorous exam before high-school graduation.
    metric:
      present: false
      quantity: policy action (a required exam), not a quantity
      record: null
    threshold:
      present: false
      stated: null
    deadline:
      present: false
      stated: null
    instrument:
      present: true
      stated: a federal graduation-exam requirement
    measurable: "partial"
    notes: >
      A named instrument with no number and no deadline. Beyond that, high-school
      graduation exams sit largely with the states, so "we will require" names an
      action whose federal reach is itself contestable — a yes/no at best.

  - id: bush-2004-troops-return
    ref: "¶47.5"
    theme: foreign-policy
    quote: >
      And then our troops will return home with the honor they have earned.
    restatement: Bring the troops home once Afghanistan and Iraq reach stability.
    metric:
      present: true
      quantity: US troop levels in Iraq/Afghanistan
      record: DoD troop-strength reports
    threshold:
      present: false
      stated: "\"return home\" implies to zero, but no level or count is stated"
    deadline:
      present: false
      stated: "\"then\" — conditioned on stability, not dated"
    instrument:
      present: false
      stated: "outcome-framed (\"our troops will return\"), no action he names"
    measurable: "partial"
    notes: >
      The same shape as Obama's Iraq pledge: troop levels are perfectly
      measurable, but the promise attaches no number and no date — withdrawal is
      made contingent on "stability and democracy" ("then"), an outcome, not a
      deadline.

  - id: bush-2004-strict-judges
    theme: judiciary
    sources:
      - in: acceptance
        ref: "¶38.4"
        quote: >
          I will continue to appoint Federal judges who know the
          difference between personal opinion and the strict
          interpretation of the law.
      - in: debate
        ref: "¶174.2"
        quote: >
          I will pick judges who will interpret the Constitution,
          but I'll have no litmus test.
    restatement: Keep appointing strict-constructionist federal judges.
    metric:
      present: false
      quantity: judicial philosophy has no agreed measure
      record: null
    threshold:
      present: false
      stated: null
    deadline:
      present: false
      stated: null
    instrument:
      present: true
      stated: judicial nominations/appointments (a named action)
    measurable: "no"
    notes: >
      A named instrument he genuinely controls, but the standard — judges who
      "know the difference between personal opinion and the strict interpretation
      of the law" — is a value judgment with no metric, number, or deadline. Like
      Obama's paid-leave pledge: a real action attached to no measurable quantity.

  - id: bush-2004-preempt-threats
    ref: "¶44.6"
    theme: foreign-policy
    quote: >
      We must and we will confront threats to America before it is too late.
    restatement: Confront threats pre-emptively, before they materialize.
    metric:
      present: false
      quantity: none
      record: null
    threshold:
      present: false
      stated: null
    deadline:
      present: false
      stated: null
    instrument:
      present: false
      stated: null
    measurable: "no"
    notes: >
      The statement of the pre-emption doctrine — a forward commitment in force,
      but pure posture: no quantity, no threshold, no deadline, no named
      instrument. The zero-of-four anchor at the aspirational end of the scale.

  # --- Promises from the 2005 inaugural address (2005-inaugural.md) ---
  # The 2005 inaugural is famously an aspirational freedom/"ending tyranny"
  # vision. Almost all of it is vision, gratitude, or history, not a forward
  # commitment; the few genuine "we will"/"I will" pledges below are all
  # aspirational (measurable: no). Refs are ¶paragraph.sentence into the
  # inaugural. See the report/merge notes for inaugural passages that restate
  # 2004 acceptance promises rather than adding new ones.

  - id: bush-2004-relations-human-rights
    theme: foreign-policy
    restatement: Condition the success of US relations on other governments' decent treatment of their own people.
    sources:
      - in: inaugural
        ref: "¶10.2"
        quote: >
          We will encourage reform in other governments by making clear that
          success in our relations will require the decent treatment of their
          own people.
    metric:
      present: false
      quantity: no agreed measure ("decent treatment"; "success in our relations" is undefined)
      record: null
    threshold:
      present: false
      stated: null
    deadline:
      present: false
      stated: null
    instrument:
      present: true
      stated: "\"making clear that success in our relations will require...\" — conditioning bilateral relations on human-rights conduct"
    measurable: "no"
    notes: >
      The most concrete of the inaugural's freedom-agenda lines: unlike the pure
      vision of ¶7-8 ("ending tyranny"), this names an actual lever — tying the
      standing of US relations to a government's treatment of its people. But
      "decent treatment" and "success in our relations" have no metric, no
      threshold, and no deadline, so it grades no despite the named instrument.

  - id: bush-2004-ownership-society
    theme: economy
    restatement: Reform major institutions to build an "ownership society" and bring the highest standards to schools.
    sources:
      - in: inaugural
        ref: "¶21.3-21.4"
        quote: >
          And now we will extend this vision by reforming great institutions to
          serve the needs of our time. To give every American a stake in the
          promise and future of our country, we will bring the highest standards
          to our schools and build an ownership society.
      - in: debate
        ref: "¶221.2"
        quote: >
          I think—I believe part of a hopeful society is one in
          which somebody owns something.
    metric:
      present: false
      quantity: "\"an ownership society\" and \"highest standards\" have no single agreed measure"
      record: null
    threshold:
      present: false
      stated: null
    deadline:
      present: false
      stated: null
    instrument:
      present: true
      stated: "\"reforming great institutions\" — a named (if broad) legislative/administrative program"
    measurable: "no"
    notes: >
      The inaugural's flagship domestic doctrine and the same shape as Obama's
      "world-class education" pledge: a real named instrument (reforming great
      institutions) under an aspirational goal with no metric, threshold, or
      deadline. The concrete expansions in ¶21.5 ("widen the ownership of homes
      and businesses, retirement savings, and health insurance") largely restate
      the 2004 acceptance's homes-ownership and personal-accounts pledges and are
      flagged as merge candidates, not folded in here, to avoid double-counting.

  - id: bush-2004-heal-divisions
    theme: unity
    restatement: Strive in good faith to heal the nation's divisions.
    sources:
      - in: inaugural
        ref: "¶25.2"
        quote: >
          We have known divisions, which must be healed to move forward in great
          purposes, and I will strive in good faith to heal them.
      - in: debate
        ref: "¶241.1"
        quote: >
          I'll continue in the 4 years to continue to try to work to
          do so.
    metric:
      present: false
      quantity: none ("divisions" has no agreed measure)
      record: null
    threshold:
      present: false
      stated: null
    deadline:
      present: false
      stated: null
    instrument:
      present: false
      stated: "\"strive in good faith\" — effort, not a named action"
    measurable: "no"
    notes: >
      A genuine "I will" forward commitment kept as an aspirational anchor (the
      counterpart to Obama's "restore our moral standing"): no quantity, no
      threshold, no deadline, and "strive in good faith" names effort rather than
      a controllable instrument.

  - id: bush-2004-deficit-half
    theme: fiscal
    restatement: Cut the federal budget deficit in half within five years.
    sources:
      - in: debate
        ref: "¶46.2-46.3"
        quote: >
          I sent up my budget man to the Congress, and he says,
          "Here's how we're going to reduce the deficit in half by 5
          years." It requires pro-growth policies that grow our
          economy and fiscal sanity in the Halls of Congress.
    metric:     { present: true, stated: the federal budget deficit }
    threshold:  { present: true, stated: reduced by half }
    deadline:   { present: true, stated: within five years }
    instrument: { present: true, stated: pro-growth policies plus spending restraint }
    measurable: "full"
    notes: >
      Metric, threshold, deadline and instrument are all present. Still
      disputable on baseline (which projected deficit) and on how the
      endpoint is dated.

  - id: bush-2004-iraqi-troops
    theme: foreign-policy
    restatement: Have 125,000 Iraqi security forces trained by the end of 2004.
    sources:
      - in: debate
        ref: "¶195.1-195.2"
        quote: >
          The best way to take the pressure off our troops is to
          succeed in Iraq, is to train Iraqis so they can do the
          hard work of democracy, is to give them a chance to defend
          their country, which is precisely what we're doing. We'll
          have 125,000 troops trained by the end of this year.
    metric:     { present: true, stated: Iraqi security forces trained }
    threshold:  { present: true, stated: 125,000 }
    deadline:   { present: true, stated: by the end of 2004 }
    instrument: { present: true, stated: US-led training mission }
    measurable: "full"
    notes: >
      A rare fully specified debate promise: number, deadline and
      instrument all stated. Verification turns on what counts as
      'trained'.

  - id: bush-2004-marriage-amendment
    theme: marriage
    restatement: Amend the US Constitution to define marriage as between a man and a woman.
    sources:
      - in: debate
        ref: "¶76.1-76.3"
        quote: >
          I proposed a constitutional amendment. The reason I did so
          was because I was worried that activist judges are
          actually defining the definition of marriage. And the
          surest way to protect marriage between a man and woman is
          to amend the Constitution.
    metric:     { present: false }
    threshold:  { present: false }
    deadline:   { present: false }
    instrument: { present: true, stated: a constitutional amendment }
    measurable: "partial"
    notes: >
      Instrument is explicit; ratification is outside a president's
      control and unbounded in time.

  - id: bush-2004-temp-worker
    theme: immigration
    restatement: Create a temporary-worker card matching willing foreign workers with willing employers when no American will take the job.
    sources:
      - in: debate
        ref: "¶150.1"
        quote: >
          And so, in order to take pressure off the border, in order
          to make the borders more secure, I believe there ought to
          be a temporary-worker card that allows a willing worker
          and a willing employer to mate up—so long as there's not
          an American willing to do the job—to join up in order to
          be able to fulfill the employer's needs.
    metric:     { present: false }
    threshold:  { present: false }
    deadline:   { present: false }
    instrument: { present: true, stated: a temporary-worker card program }
    measurable: "partial"
    notes: >
      Named program, explicitly not amnesty; no numeric cap or date.

  - id: bush-2004-border-security
    theme: immigration
    restatement: Keep increasing Border Patrol manpower and equipment, including unmanned aircraft, over the next four years.
    sources:
      - in: debate
