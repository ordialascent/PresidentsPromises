# Promises and ambitions of George W. Bush's 2005-2009 term, extracted under
# corpus/PROTOCOL.md (protocol 1) from three sources: the 2004 acceptance
# speech, the 2004 final debate (Bush's turns) and the 2005 inaugural.
# Every source occurrence is named by an include row in that source's
# screening ledger (<year>-<kind>.screening.yaml); `npm run validate` checks both.
#
# 72 promises (high 15, medium 21, low 36)
# 14 ambitions (high 3, medium 5, low 6)
# Deadlines default to the end of the term (2009-01-20).

protocol: 1
promises:

