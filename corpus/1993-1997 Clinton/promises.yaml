# Promises and ambitions of Bill Clinton's 1993-1997 term, extracted under
# corpus/PROTOCOL.md (protocol 1) from three sources: the 1992 acceptance
# speech, the 1992 final debate (Clinton's turns) and the 1993 inaugural.
# Every source occurrence is named by an include row in that source's
# screening ledger (<year>-<kind>.screening.yaml); `npm run validate` checks both.
#
# 37 promises (high 4, medium 13, low 20)
# 20 ambitions (high 4, medium 5, low 11)
# Deadlines default to the end of the term (1997-01-20).

protocol: 1
promises:
  # ---- inaugural ----------------------------------------------------------
  - id: clinton-1992-end-deadlock
    kind: promise
    sources:
    - in: inaugural
      ref: ¶7.3
      quote: "And so today we pledge an end to the era of deadlock and drift, and a new season of American renewal has begun."
    restatement: "End the era of deadlock and drift."
    type: ongoing
    theme: government
    deadline: { stated: null, applied: 1997-01-20 }
    verifiability:
      level: low
    uncertainty:
      extraction: probable
      note: "\"We\" is the country and the government he now leads; read as a commitment of both."
    links: []

