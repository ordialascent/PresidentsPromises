# Screening ledger for 1992-debate.md (protocol v1).
# Only Clinton's turns (speaker_label "Governor Clinton") are screened.
# Every trigger-matched sentence has a row. Ids shared with the other two
# ledgers are further occurrences of the same promise; a soft restatement
# of a firm promise is an occurrence of it.
#
# Not candidates: ¶9.1-10.1 ("I propose …", "invest and grow: raise some
# more money …") and ¶283.3 ("My passion is to pass …"), which describe the
# plan in the present tense. ¶294.2 ("My plan says that we want …")
# matches a trigger and is screened as such a description, as the Bush 2000
# (¶23.16) and Clinton 1996 (¶117.3) debates were.
#
# Added: ¶107.1 ("We also ought to …", an ambition the lexicon misses
# because of "also") and ¶265.1 ("… and that will be my policy").
#
# The source transcript breaks off inside ¶265.3 ("and not >") and resumes
# in ¶266.1 ("em, but …"); the text is kept as published.
