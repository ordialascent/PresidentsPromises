# Screening ledger for 1992-acceptance.md (protocol v1).
# Every trigger-matched sentence has a row.
#
# ¶57.1-67.1 contrast Bush with Clinton ("He won't …, but I will."). The
# "I will" turns the sentence into Clinton's own commitment to what Bush
# is said not to do; the object is read from the first half.
#
# ¶85.1-103.1 describe the "New Covenant" as a vision ("An America in which
# …") with no future verb and no named actor; like the 1997 inaugural's
# vision of the next century, they are not candidates, except where a
# sentence adds "we will" (¶86.1, ¶88.2, ¶98.2). ¶98.1 is joined to ¶98.2,
# which states how it will be done.
#
# Added (no trigger, but future and tied to the election): ¶7.1 and ¶50.3
# ("when I am President …").
source: 1992-acceptance
