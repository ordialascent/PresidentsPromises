# Promises and ambitions of Donald J. Trump's 2017-2021 term, extracted under
# corpus/PROTOCOL.md (protocol 1) from three sources: the 2016 acceptance
# speech, the 2016 final debate (Trump's turns) and the 2017 inaugural.
# Every source occurrence is named by an include row in that source's
# screening ledger (<year>-<kind>.screening.yaml); `npm run validate` checks both.
#
# 88 promises (high 6, medium 41, low 41)
# 9 ambitions (high 0, medium 3, low 6)
# Deadlines default to the end of the term (2021-01-20).

protocol: 1
promises:

