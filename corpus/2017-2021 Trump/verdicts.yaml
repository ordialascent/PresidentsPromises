  - promise: trump-2016-pro-life-justices
    verdict: kept
    as_of: 2026-11-16
    summary: All three justices he appointed voted to restrict abortion when the issue came before them during the term. Gorsuch and Kavanaugh dissented in June Medical Services v. Russo (2020), and Barrett joined the January 2021 order reinstating in-person rules for abortion pills.
    evidence:
      - what: June Medical Services L.L.C. v. Russo, 591 U.S. ___ (2020)
        url: https://www.supremecourt.gov/opinions/19pdf/18-1323_c07d.pdf
        publisher: Supreme Court of the United States
        date: 2020-06-29
      - what: FDA v. American College of Obstetricians and Gynecologists (20A34), order granting stay
        url: https://www.supremecourt.gov/opinions/20pdf/20a34_3f14.pdf
        publisher: Supreme Court of the United States
        date: 2021-01-12
    uncertainty:
      verdict: probable
      note: Barrett's vote was on a stay, not the merits. Their 2022 votes to overturn Roe fall after the deadline and do not count.

  - promise: trump-2016-second-amendment-justices
    verdict: kept
    as_of: 2026-11-16
    summary: When gun rights came before the Court during the term, his appointees sided with them. In New York State Rifle & Pistol Ass'n v. City of New York (2020), Gorsuch would have struck down the city's rule, and Kavanaugh wrote that the Court should soon take up similar cases. Barrett had no Second Amendment case at the Court before the deadline.
    evidence:
      - what: New York State Rifle & Pistol Ass'n v. City of New York, 590 U.S. ___ (2020)
        url: https://www.supremecourt.gov/opinions/19pdf/18-280_ba7d.pdf
        publisher: Supreme Court of the United States
        date: 2020-04-27
    uncertainty:
      verdict: probable
      note: Barrett is judged only from later votes, which fall after the deadline. Kavanaugh also joined part of Justice Thomas's dissent from the June 2020 refusal to hear Rogers v. Grewal (from memory).

  - promise: trump-2016-buy-american-hire-american
    verdict: kept
    as_of: 2026-11-16
    summary: Rules were changed on both sides. Executive Order 13788 (April 2017) ordered stricter procurement and visa rules, the 2019 H-1B selection rule favoured US-degree holders, and Executive Order 13881 (July 2019) raised the domestic-content thresholds for federal procurement, finalised in the FAR in January 2021.
    evidence:
      - what: Executive Order 13788, Buy American and Hire American
        url: https://www.federalregister.gov/executive-order/13788
        publisher: Federal Register
        date: 2017-04-18
      - what: Executive Order 13881, Maximizing Use of American-Made Goods, Products, and Materials
        url: https://www.federalregister.gov/executive-order/13881
        publisher: Federal Register
        date: 2019-07-15
    uncertainty:
      verdict: clear
      note: Some wage rules for visas were struck down in court in late 2020; the procurement changes stand.
