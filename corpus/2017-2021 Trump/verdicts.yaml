        url: https://www.congress.gov/bill/115th-congress/house-bill/1628
        publisher: Congress.gov
        date: 2017-05-04
      - what: Tax Cuts and Jobs Act (Pub. L. 115-97), section 11081 (mandate penalty reduced to zero)
        url: https://www.govinfo.gov/content/pkg/PLAW-115publ97/html/PLAW-115publ97.htm
        publisher: GovInfo (U.S. Government Publishing Office)
        date: 2017-12-22
    uncertainty: { verdict: clear }

  - promise: trump-2016-replace-obamacare
    verdict: broken
    as_of: 2026-11-16
    summary: No law replaced the ACA's marketplaces and subsidies. The House-passed American Health Care Act would have, but it did not pass the Senate.
    attempt: passed-chamber
    evidence:
      - what: H.R. 1628, American Health Care Act of 2017 (passed House 4 May 2017)
        url: https://www.congress.gov/bill/115th-congress/house-bill/1628
        publisher: Congress.gov
        date: 2017-05-04
    uncertainty: { verdict: clear }

  - promise: trump-2016-veterans-choice
    verdict: kept
    as_of: 2026-11-16
    summary: The VA MISSION Act of June 2018 lets veterans use community doctors when VA cannot meet access standards. From June 2019 these were a 20-day wait (28 days for specialists) or a 30- or 60-minute drive.
    evidence:
      - what: VA MISSION Act of 2018 (Pub. L. 115-182), section 101
        url: https://www.govinfo.gov/content/pkg/PLAW-115publ182/html/PLAW-115publ182.htm
        publisher: GovInfo (U.S. Government Publishing Office)
        date: 2018-06-06
    uncertainty:
      verdict: clear
      note: Access is subject to wait and drive-time standards, which the ambiguity accepts.

  # ---- defence and foreign policy -------------------------------------------------

  - promise: trump-2016-defeat-isis
    verdict: kept
    as_of: 2026-11-16
    summary: ISIS lost all the territory it held. Iraq declared victory in December 2017, and the last ISIS-held town in Syria, Baghuz, fell in March 2019. The group remained active as an insurgency.
    evidence:
      - what: Lead Inspector General Report to the U.S. Congress, Operation Inherent Resolve, 1 January-31 March 2019
        url: https://media.defense.gov/2019/May/02/2002127082/-1/-1/1/FY2019_LIG_OCOREPORT.PDF
        publisher: Department of Defense Office of Inspector General
        date: 2019-05-02
    uncertainty:
      verdict: clear
      note: The criterion is territory, not the end of the group.

  - promise: trump-2016-rebuild-military
    verdict: partly
    as_of: 2026-11-16
    summary: Real defense outlays were $575.4bn in FY2016 (FY2012 dollars), $572.4bn in FY2017, then $587.2bn, $624.5bn and $657.1bn in FY2018-2020. They were higher than FY2016 in three of the four years.
    evidence:
      - what: OMB Historical Tables, Table 6.1, Composition of Outlays (national defense, constant FY2012 dollars)
        url: https://www.govinfo.gov/content/pkg/BUDGET-2022-TAB/xls/BUDGET-2022-TAB-7-1.xlsx
        publisher: Office of Management and Budget (via GovInfo)
        date: 2021-05-28
    uncertainty:
      verdict: contested
      note: FY2017 was budgeted before the term began. A reader who leaves it out would call this kept.

  - promise: trump-2016-allies-pay-fair-share
    verdict: kept
    review: 'NATO Europe and Canada defence spending as % of GDP, 2016 vs 2020; Korea cost-sharing increase (from memory).'
    as_of: 2026-11-16
    summary: Defence spending by NATO's European members and Canada rose from about 1.4% of GDP in 2016 to about 1.8% in 2020. The cost-sharing agreement with South Korea renewed in 2019 raised its payment by 8.2%. The agreement with Japan was not renewed during the term.
    evidence:
      - what: NATO, Defence Expenditure of NATO Countries (2013-2020)
        url: https://www.nato.int/cps/en/natohq/news_182242.htm
        publisher: NATO
        date: 2021-03-16
    uncertainty:
      verdict: probable
      note: The 2020 share is partly due to the fall in GDP. The Korea figure is from memory. A reader who requires renewed agreements with every host country would call this partly.

