  # ---- government and courts ----------------------------------------------------

  - promise: trump-2016-wasteful-spending-100-days
    verdict: kept
    as_of: 2026-11-16
    summary: Executive Order 13781 of 13 March 2017 directed every agency head to propose eliminating or reorganising unneeded functions, and OMB's memorandum M-17-22 of 12 April 2017 set the deadlines. Both fell within the first 100 days.
    evidence:
      - what: Executive Order 13781, Comprehensive Plan for Reorganizing the Executive Branch
        url: https://www.federalregister.gov/documents/2017/03/16/2017-05399/comprehensive-plan-for-reorganizing-the-executive-branch
        publisher: Federal Register
        date: 2017-03-13
    uncertainty:
      verdict: probable
      note: The order asks for unneeded agencies and programmes rather than "wasteful spending projects"; read as the same request.

  - promise: trump-2016-supreme-court-scalia
    verdict: kept
    as_of: 2026-11-16
    summary: Neil Gorsuch, a judge known for textualism and originalism, was confirmed to Justice Scalia's seat in April 2017.
