# Promises and ambitions of Barack Obama's 2013-2017 term, extracted under
# corpus/PROTOCOL.md (protocol 1) from three sources: the 2012 acceptance
# speech, the 2012 final debate (Obama's turns) and the 2013 inaugural.
# Every source occurrence is named by an include row in that source's
# screening ledger (<year>-<kind>.screening.yaml); `npm run validate` checks both.
#
# 43 promises (high 6, medium 18, low 19)
# 48 ambitions (high 4, medium 21, low 23)
# Deadlines default to the end of the term (2017-01-20).

protocol: 1
promises:

  - id: obama-2012-export-more
    kind: ambition
    sources:
    - in: acceptance
      ref: ¶21.3
      quote: "We can choose a future where we export more products"
    restatement: "Export more products."
    group: obama-2012-trade-jobs
    type: outcome
    theme: trade
    deadline:
      stated: null
      applied: 2017-01-20
    verifiability:
      level: high
      object: "US exports of goods"
      record: "Census Bureau / BEA international trade data (FT-900)"
      criterion: "annual US goods exports are higher in the last full year of the term than in 2012"
    uncertainty:
      extraction: clear
    links: []

