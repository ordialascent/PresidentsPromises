# Promises and ambitions of Joseph R. Biden, Jr.'s 2021-2025 term, extracted under
# corpus/PROTOCOL.md (protocol 1) from three sources: the 2020 acceptance
# speech, the 2020 final debate (Biden's turns) and the 2021 inaugural.
# Every source occurrence is named by an include row in that source's
# screening ledger (<year>-<kind>.screening.yaml); `npm run validate` checks both.
#
# 70 promises (high 11, medium 30, low 29)
# 8 ambitions (high 3, medium 3, low 2)
# Deadlines default to the end of the term (2025-01-20).

protocol: 1
promises:

