        url: https://www.federalregister.gov/documents/2024/11/18/2024-26003/waste-emissions-charge-for-petroleum-and-natural-gas-systems-procedures-for-facilitating-compliance
        publisher: Federal Register
        date: 2024-11-18
    uncertainty: { verdict: clear }

