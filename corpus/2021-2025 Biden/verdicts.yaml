  # ---- foreign policy -----------------------------------------------------------

  - promise: biden-2020-punish-election-interference
    verdict: kept
    as_of: 2026-11-16
    summary: The intelligence community found that Russia and Iran tried to influence the 2020 election and that China did not. Biden sanctioned Russia for it in April 2021, and Iranian actors in November 2021 and again for the 2024 election in September 2024.
    evidence:
      - what: ODNI, Foreign Threats to the 2020 US Federal Elections (ICA 2020-00078D)
        url: https://www.dni.gov/files/ODNI/documents/assessments/ICA-declass-16MAR21.pdf
        publisher: Office of the Director of National Intelligence
        date: 2021-03-10
      - what: Treasury, "Treasury Sanctions Russia with Sweeping New Sanctions Authority" (Executive Order 14024, election interference)
        url: https://home.treasury.gov/news/press-releases/jy0127
        publisher: U.S. Department of the Treasury
        date: 2021-04-15
      - what: Treasury, "Treasury Sanctions Iran Cyber Actors for Attempting to Influence the 2020 U.S. Presidential Election"
        url: https://home.treasury.gov/news/press-releases/jy0494
        publisher: U.S. Department of the Treasury
        date: 2021-11-18
      - what: Treasury, "Treasury Sanctions Iranian Regime Agents Attempting to Interfere in U.S. Elections"
        url: https://home.treasury.gov/news/press-releases/jy2617
        publisher: U.S. Department of the Treasury
        date: 2024-09-27
    uncertainty:
      verdict: probable
      note: The promise names China too. The intelligence assessment found no Chinese interference in 2020, so no measure was required.

  # ---- energy and climate -------------------------------------------------------

  - promise: biden-2020-rejoin-paris
    verdict: kept
    as_of: 2026-11-16
    summary: Biden signed the instrument to rejoin on 20 January 2021, and the United States was a party again from 19 February 2021.
    evidence:
      - what: Statement, Paris Climate Agreement (acceptance on behalf of the United States)
        url: https://bidenwhitehouse.archives.gov/briefing-room/statements-releases/2021/01/20/paris-climate-agreement/
        publisher: The White House
        date: 2021-01-20
      - what: UNFCCC, "US Officially Rejoins the Paris Agreement"
        url: https://unfccc.int/news/us-officially-rejoins-the-paris-agreement
        publisher: UNFCCC
        date: 2021-02-19
    uncertainty: { verdict: clear }

  - promise: biden-2020-ev-charging-50k
    verdict: kept
    review: 'NEVI-funded charging ports open by January 2025 (a few hundred, from memory).'
    as_of: 2026-11-16
    summary: The 2021 infrastructure law set aside $7.5 billion for public EV charging, $5 billion of it for chargers along highway corridors, enough by the administration's estimate for far more than 50,000. By the deadline only a few hundred chargers paid for by the highway programme were open.
    evidence:
      - what: Infrastructure Investment and Jobs Act (Public Law 117-58), Division J, Title VIII (National Electric Vehicle Infrastructure Formula Program) and sec. 11401 (Charging and Fueling Infrastructure grants)
        url: https://www.govinfo.gov/app/details/PLAW-117publ58
        publisher: govinfo (U.S. Government Publishing Office)
        date: 2021-11-15
    uncertainty:
      verdict: contested
      note: The criterion is funding, which was enacted. A reader who counts chargers actually built by the deadline would call this broken; the open-charger count is from memory.

  - promise: biden-2020-retrofit-buildings
    verdict: indeterminate
    review: 'Buildings retrofitted 2021-2024 (IRS and DOE counts).'
    as_of: 2026-11-16
    summary: No record counts retrofitted buildings. The 2021 and 2022 laws funded efficiency upgrades through grants, tax deductions and rebates, but no federal count of buildings upgraded in the term exists.
    evidence:
      - what: Inflation Reduction Act of 2022 (Public Law 117-169), sec. 13303 (energy-efficient commercial buildings deduction) and sec. 50121-50122 (home energy rebates)
        url: https://www.govinfo.gov/app/details/PLAW-117publ169
        publisher: govinfo (U.S. Government Publishing Office)
        date: 2022-08-16
    uncertainty:
      verdict: contested
      note: Missing evidence. A reader who expects the programmes to report counts, and takes their silence as failure, would call this broken.

  - promise: biden-2020-retrofit-homes
    verdict: indeterminate
    review: 'Homes retrofitted 2021-2024 (IRS 25C claims; DOE weatherization counts).'
    as_of: 2026-11-16
    summary: No record counts homes retrofitted to leak less energy. The Weatherization Assistance Program does a few tens of thousands of homes a year. Millions of households claimed the home-improvement tax credit for 2023, but the credit also covers equipment such as heat pumps, so the claims do not count weatherized homes.
    evidence:
      - what: Infrastructure Investment and Jobs Act (Public Law 117-58), sec. 40551 (Weatherization Assistance Program, $3.5 billion)
        url: https://www.govinfo.gov/app/details/PLAW-117publ58
        publisher: govinfo (U.S. Government Publishing Office)
        date: 2021-11-15
      - what: Inflation Reduction Act of 2022 (Public Law 117-169), sec. 13301 (energy efficient home improvement credit)
        url: https://www.govinfo.gov/app/details/PLAW-117publ169
        publisher: govinfo (U.S. Government Publishing Office)
        date: 2022-08-16
    uncertainty:
      verdict: contested
      note: Missing evidence. A reader who counts every credit claim as a retrofit could call this kept; one who counts only weatherization would call it broken.

  - promise: biden-2020-capture-fracking-emissions
