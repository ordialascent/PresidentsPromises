  - promise: trump-2024-redirect-green-funds
    verdict: pending
    as_of: 2026-11-16
    summary: The July 2025 law rescinded unobligated balances of about two dozen clean-energy and environmental programmes and repealed the Greenhouse Gas Reduction Fund. It did not redirect them to roads, bridges or dams, and many clean-energy funds remain.
    evidence:
