  - promise: trump-2024-protect-medicare
    verdict: broken
    as_of: 2026-11-16
    summary: The July 2025 law ended Medicare eligibility for some lawfully present immigrants, such as refugees and asylees, who had qualified before. No law cut benefits for beneficiaries in general.
    attempt: none
    evidence:
      - what: One Big Beautiful Bill Act (Public Law 119-21), sec. 71201, Limiting Medicare coverage of certain individuals
