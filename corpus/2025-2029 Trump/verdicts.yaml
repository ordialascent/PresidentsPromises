# Verdicts for Donald Trump's 2025-2029 term, judged under corpus/PROTOCOL.md §6.
# One record per high or medium promise in promises.yaml. Deadline: 2029-01-20
# unless the promise states another. The term is running: a promise not yet met
# is pending and is reviewed when its deadline passes.
#
# Complete: high 21/21, medium 31/31.

protocol: 1
verdicts:

  # ---- border and immigration ------------------------------------------------------

  - promise: trump-2024-border-emergency
    verdict: kept
    as_of: 2026-11-16
    summary: On 20 January 2025 Trump proclaimed a national emergency at the southern border.
    evidence:
      - what: Proclamation 10886, Declaring a National Emergency at the Southern Border of the United States
        url: https://www.federalregister.gov/d/2025-01948
        publisher: Federal Register
        date: 2025-01-20
    uncertainty: { verdict: clear }

  - promise: trump-2024-close-border
    verdict: kept
    as_of: 2026-11-16
    summary: Orders on 20 January 2025 suspended entry at the southern border and ended routine release. Border Patrol apprehensions at the southwest border fell from about 47,000 in December 2024 to about 8,000 in February 2025, the lowest monthly count on record, and stayed near that level.
    evidence:
      - what: Proclamation 10888, Guaranteeing the States Protection Against Invasion, and Executive Order 14165, Securing Our Borders
        url: https://www.federalregister.gov/executive-order/14165
        publisher: Federal Register
        date: 2025-01-20
      - what: CBP, Southwest Land Border Encounters (monthly Border Patrol apprehensions)
        url: https://www.cbp.gov/newsroom/stats/southwest-land-border-encounters
        publisher: U.S. Customs and Border Protection
        date: 2026-11-16
    uncertainty:
      verdict: contested
      note: The monthly figures are from memory (cbp.gov blocks scripts). Crossings reached record lows within weeks, not literally on the first day; a reader holding to "from the first day" would call this partly.

  - promise: trump-2024-end-catch-and-release
    verdict: kept
    as_of: 2026-11-16
    summary: Executive Order 14165 ordered the end of catch-and-release on 20 January 2025. Border Patrol releases of apprehended crossers into the US fell to near zero in the months after.
    evidence:
      - what: Executive Order 14165, Securing Our Borders, sec. 7
        url: https://www.federalregister.gov/executive-order/14165
        publisher: Federal Register
        date: 2025-01-20
      - what: CBP monthly operational updates (Border Patrol releases)
        url: https://www.cbp.gov/newsroom/stats/southwest-land-border-encounters
        publisher: U.S. Customs and Border Protection
        date: 2026-11-16
    uncertainty:
      verdict: probable
      note: The release figures are from memory (cbp.gov blocks scripts).

  - promise: trump-2024-remain-in-mexico
    verdict: kept
    as_of: 2026-11-16
    summary: Executive Order 14165 directed DHS to resume the Migrant Protection Protocols, and DHS announced their reinstatement on 21 January 2025. It published an environmental assessment for the programme in April 2025.
    evidence:
      - what: Executive Order 14165, Securing Our Borders, sec. 7(a)
        url: https://www.federalregister.gov/executive-order/14165
        publisher: Federal Register
        date: 2025-01-20
      - what: DHS, Notice of Availability of a Draft Programmatic Environmental Assessment for actions related to the Migrant Protection Protocols
        url: https://www.federalregister.gov/d/2025-06816
        publisher: Federal Register
        date: 2025-04-25
    uncertainty:
      verdict: probable
      note: DHS's reinstatement announcement (dhs.gov) could not be read by script. How many people were actually returned to Mexico under it is not checked; the verdict counts the reinstatement.

  - promise: trump-2024-troops-to-border
    verdict: kept
    as_of: 2026-11-16
    summary: Proclamation 10886 ordered the Secretary of Defense to deploy forces to the southern border. About 1,500 more active-duty troops were sent in the first week, and in April 2025 strips of the border were placed under military jurisdiction.
    evidence:
      - what: Proclamation 10886, sec. 3
        url: https://www.federalregister.gov/d/2025-01948
        publisher: Federal Register
        date: 2025-01-20
      - what: Department of Defense announcement of additional active-duty troops to the southern border
        url: https://www.defense.gov/News/Releases/
        publisher: U.S. Department of Defense
        date: 2025-01-22
    uncertainty:
      verdict: probable
      note: The troop numbers are from memory (defense.gov blocks scripts); the order itself is clear.

  - promise: trump-2024-cartels-fto
    verdict: kept
    as_of: 2026-11-16
    summary: Executive Order 14157 started the process on 20 January 2025, and on 20 February 2025 the State Department designated eight groups, including the Sinaloa and Jalisco cartels, as foreign terrorist organizations.
    evidence:
      - what: Executive Order 14157, Designating Cartels and Other Organizations as Foreign Terrorist Organizations and Specially Designated Global Terrorists
        url: https://www.federalregister.gov/executive-order/14157
        publisher: Federal Register
        date: 2025-01-20
      - what: State Department, Foreign Terrorist Organization Designations of Tren de Aragua, Mara Salvatrucha, Cartel de Sinaloa, Cartel de Jalisco Nueva Generacion and others
        url: https://www.federalregister.gov/d/2025-02873
        publisher: Federal Register
        date: 2025-02-20
    uncertainty: { verdict: clear }

  - promise: trump-2024-invoke-alien-enemies-act
    verdict: kept
    as_of: 2026-11-16
    summary: On 14 March 2025 Trump invoked the Alien Enemies Act against Tren de Aragua. Courts later limited how it could be used, which does not change the verdict.
    evidence:
      - what: Proclamation 10903, Invocation of the Alien Enemies Act Regarding the Invasion of the United States by Tren de Aragua
        url: https://www.federalregister.gov/d/2025-04865
        publisher: Federal Register
        date: 2025-03-14
    uncertainty: { verdict: clear }

  - promise: trump-2024-mass-deportation
    verdict: pending
    as_of: 2026-11-16
    summary: Removals have risen, but no official count shows millions of removals so far. The term runs to January 2029.
    evidence:
      - what: DHS Office of Homeland Security Statistics, immigration enforcement and removals data
        url: https://ohss.dhs.gov/topics/immigration/immigration-enforcement
        publisher: U.S. Department of Homeland Security
        date: 2026-11-16
    uncertainty:
      verdict: probable
      note: The official removals tables could not be read by script.

  - promise: trump-2024-finish-wall
    verdict: pending
    as_of: 2026-11-16
    summary: The 2025 tax and spending law funded new border barrier construction, which is under way. No report yet shows the planned barrier finished.
    evidence:
      - what: One Big Beautiful Bill Act (Public Law 119-21)
        url: https://www.govinfo.gov/app/details/PLAW-119publ21
        publisher: govinfo (U.S. Government Publishing Office)
        date: 2025-07-04
      - what: CBP, border wall status
        url: https://www.cbp.gov/border-security/along-us-borders/border-wall-system
        publisher: U.S. Customs and Border Protection
        date: 2026-11-16
    uncertainty:
      verdict: probable
      note: CBP's status page could not be read by script.


