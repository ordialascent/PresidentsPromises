  # ---- trade and tariffs -----------------------------------------------------------

  - promise: trump-2024-overhaul-trade
    verdict: kept
    as_of: 2026-11-16
    summary: An America First trade memorandum was issued on 20 January 2025, and tariffs on Canada, Mexico and China were ordered on 1 February 2025, followed by reciprocal tariffs on most countries in April.
    evidence:
      - what: Executive Order 14194, Imposing Duties To Address the Situation at Our Southern Border
        url: https://www.federalregister.gov/executive-order/14194
        publisher: Federal Register
        date: 2025-02-01
      - what: Executive Order 14257, Regulating Imports With a Reciprocal Tariff
        url: https://www.federalregister.gov/executive-order/14257
        publisher: Federal Register
        date: 2025-04-02
    uncertainty: { verdict: clear }

  - promise: trump-2024-broad-tariffs
    verdict: kept
    as_of: 2026-11-16
    summary: From April 2025 a reciprocal tariff of at least 10% applied to imports from nearly every country, alongside section 232 tariffs on steel, aluminium, cars and other goods. In February 2026 the Supreme Court ruled that the emergency-powers law did not authorise the reciprocal tariffs; they were ended and replaced the same day by a temporary import surcharge under the Trade Act.
    evidence:
      - what: Executive Order 14257, Regulating Imports With a Reciprocal Tariff
        url: https://www.federalregister.gov/executive-order/14257
        publisher: Federal Register
        date: 2025-04-02
      - what: Learning Resources, Inc. v. Trump, No. 24-1287 (slip opinion)
        url: https://www.supremecourt.gov/opinions/25pdf/24-1287_4gcj.pdf
        publisher: Supreme Court of the United States
        date: 2026-02-20
      - what: Proclamation 11012, Imposing a Temporary Import Surcharge, and Executive Order 14389, Ending Certain Tariff Actions
        url: https://www.federalregister.gov/d/2026-03824
        publisher: Federal Register
        date: 2026-02-20
    uncertainty: { verdict: clear }

  - promise: trump-2024-tariff-revenue
    verdict: kept
    as_of: 2026-11-16
    summary: Net customs duties were $264 billion in calendar 2025, up from about $80 billion a year before. After the February 2026 ruling, refunds made net receipts negative in May-July 2026; fiscal 2026 still came to $173 billion.
    evidence:
      - what: Treasury, Monthly Treasury Statement, Table 4 (customs duties, net receipts)
        url: https://fiscaldata.treasury.gov/datasets/monthly-treasury-statement/
        publisher: U.S. Department of the Treasury
        date: 2026-10-31
    uncertainty:
      verdict: contested
      note: Part of the 2025 revenue came from tariffs later found unlawful and is being refunded. A reader who nets those refunds against the year they were collected could find no 12 months above $200 billion and would call this pending.

  - promise: trump-2024-mexico-car-tariff
    verdict: pending
    as_of: 2026-11-16
    summary: A 25% section 232 tariff on imported cars took effect in April 2025. No tariff of about 100% or more on cars from Chinese-owned plants in Mexico is in force.
    evidence:
      - what: Proclamation 10908, Adjusting Imports of Automobiles and Automobile Parts Into the United States
        url: https://www.federalregister.gov/d/2025-05930
        publisher: Federal Register
        date: 2025-03-26
    uncertainty: { verdict: clear }

  - promise: trump-2024-external-revenue-service
    verdict: pending
    as_of: 2026-11-16
    summary: No order or law has established an External Revenue Service; tariffs are still collected by Customs and Border Protection.
    evidence:
      - what: Federal Register, executive orders signed by Donald Trump, 2025-2026 (none establishes it)
        url: https://www.federalregister.gov/presidential-documents/executive-orders/donald-trump/2025
        publisher: Federal Register
        date: 2026-11-16
    uncertainty: { verdict: clear }


