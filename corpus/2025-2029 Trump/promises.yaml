    metric:
      present: true
      quantity: whether US astronauts land on Mars (binary milestone)
      record: NASA mission milestones
    threshold:
      present: true
      stated: plant the flag on Mars (crewed landing)
    deadline:
      present: false
      stated: null
    instrument:
      present: true
      stated: launch American astronauts (NASA/commercial crewed program)
    measurable: "partial"
    notes: >
