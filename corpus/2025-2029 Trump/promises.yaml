      record: canal ownership / operating-control status; treaty instruments
    threshold:
      present: true
      stated: taking it back (regain US control)
    deadline:
      present: false
      stated: null
    instrument:
      present: false
      stated: asserts "we're taking it back" but names no mechanism — an outcome depending on Panama
    measurable: "partial"
    notes: >
      Control of the canal is a knowable yes/no fact, but "taking it back" names
