# Promises and ambitions of Donald J. Trump's 2025-2029 term, extracted under
# corpus/PROTOCOL.md (protocol 1) from three sources: the 2024 acceptance
# speech, the 2024 final debate (Trump's turns) and the 2025 inaugural.
# Every source occurrence is named by an include row in that source's
# screening ledger (<year>-<kind>.screening.yaml); `npm run validate` checks both.
#
# 92 promises (high 21, medium 31, low 40)
# 2 ambitions (high 1, medium 1, low 0)
# Deadlines default to the end of the term (2029-01-20).

protocol: 1
promises:

