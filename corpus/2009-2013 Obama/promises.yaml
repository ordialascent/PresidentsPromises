# Promises and ambitions of Barack Obama's 2009-2013 term, extracted under
# corpus/PROTOCOL.md (protocol 1) from three sources: the 2008 acceptance
# speech, the 2008 final debate (Obama's turns) and the 2009 inaugural.
# Every source occurrence is named by an include row in that source's
# screening ledger (<year>-<kind>.screening.yaml); `npm run validate` checks both.
#
# 61 promises (high 6, medium 26, low 29)
# 24 ambitions (high 3, medium 5, low 16)
# Deadlines default to the end of the term (2013-01-20).

protocol: 1
promises:

  - id: obama-2008-create-jobs
