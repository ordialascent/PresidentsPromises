  - { ref: "¶13.3", decision: include, promises: [reagan-1984-freedom-for-all] }
  - { ref: "¶15.2", decision: include, promises: [reagan-1984-do-right] }
  - ref: "¶20.2-20.3"
    decision: include
    promises: [reagan-1984-restrain-spending]
    note: "¶20.3 names the errors of ¶20.2; joined."
  - { ref: "¶22.1", decision: include, promises: [reagan-1984-simplify-taxes, reagan-1984-lower-tax-rates] }
  - { ref: "¶22.2", decision: include, promises: [reagan-1984-work-for-all] }
