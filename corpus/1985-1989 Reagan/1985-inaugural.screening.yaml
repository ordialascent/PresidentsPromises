# Screening ledger for 1985-inaugural.md (protocol v1).
# Every trigger-matched sentence has a row. Ids shared with the other two
# ledgers are further occurrences of the same promise; a soft restatement
# of a firm promise is an occurrence of it.
#
# Not candidates: "Let us …" sentences (¶26.4 on a balanced budget
# amendment, ¶28.4, ¶29.1) ask the whole country to act and match no
# trigger. ¶25.7 ("It must be done by all of us …"), ¶32.3 ("There must be
# no wavering …") and ¶33.3-33.4 ("we seek … to reduce their number") carry
# no trigger and are not stated in the future tense.
source: 1985-inaugural
protocol: 1
rows:
